<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fbf6ee">
<title>For Leilanie : )</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --paper: #fbf6ee;
  --paper-2: #f3eadd;
  --card: #fffdf9;
  --ink: #1f1a17;
  --ink-2: #6f625a;
  --rule: #e4d8c8;
  --rose: #c8456b;
  --rose-deep: #a8334f;
  --rose-soft: #f8dbe3;
  --rose-mid: #f2a8bc;
  --gold: #f5e3a6;
  --gold-ink: #6b4b00;
  --key: #ece3d6;
  --serif: 'Fraunces', Georgia, serif;
  --sans: 'Libre Franklin', -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --cell: 34px;
  --dockh: 0px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  background-image: radial-gradient(circle at 15% 10%, #fff7ef 0, transparent 45%), radial-gradient(circle at 90% 85%, #f7e9e4 0, transparent 40%);
  background-attachment: fixed;
  color: var(--ink);
  font: 16px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
[hidden] { display: none !important; }
.eyebrow { font: 600 11px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); margin: 0; }

/* ---------- lock screen ---------- */
.lock { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
.envelope {
  width: min(380px, 100%); background: var(--card); border-radius: 18px; padding: 40px 28px 30px; text-align: center;
  box-shadow: 0 1px 0 var(--rule), 0 18px 40px -18px rgba(90, 50, 40, .35);
  position: relative;
}
.envelope::before { content: ""; position: absolute; inset: 8px; border: 1px dashed var(--rule); border-radius: 12px; pointer-events: none; }
.seal { width: 74px; height: 74px; margin: 0 auto 18px; display: block; filter: drop-shadow(0 3px 4px rgba(120, 30, 50, .3)); }
.to { font: 400 italic 44px/1.05 var(--serif); margin: 10px 0 26px; }
.lock label { display: block; font: 400 italic 17px/1.4 var(--serif); color: var(--ink-2); margin-bottom: 14px; }
.lock input {
  width: 100%; font: 500 17px var(--sans); text-align: center; padding: 13px 14px; border-radius: 12px;
  border: 1.5px solid var(--rule); background: var(--paper); color: var(--ink); outline: none;
}
.lock input:focus { border-color: var(--rose); box-shadow: 0 0 0 4px var(--rose-soft); }
.btn {
  display: block; width: 100%; margin-top: 12px; padding: 13px 16px; border-radius: 12px; border: 0;
  background: var(--ink); color: #fff; font: 600 16px var(--sans); text-align: center; text-decoration: none;
}
.btn:active { transform: scale(.98); }
.btn.rose { background: var(--rose); }
.btn.ghost { background: transparent; color: var(--ink-2); }
.btn:disabled { opacity: .6; }
.msg { min-height: 22px; margin: 14px 0 0; font-size: 14px; color: var(--rose-deep); }
.hint2 { margin: 6px 0 0; font: 600 20px ui-monospace, 'SF Mono', Menlo, monospace; letter-spacing: .14em; color: var(--ink); }
.shake { animation: shake .42s; }
@keyframes shake { 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }

/* ---------- puzzle ---------- */
.app { max-width: 1040px; margin: 0 auto; padding: 14px 16px calc(var(--dockh) + 28px); }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 4px 0 14px; }
.top h1 { font: 600 26px/1.1 var(--serif); margin: 0; }
.top p { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-2); }
.meta { display: flex; align-items: center; gap: 10px; flex-shrink: 0; padding-top: 2px; }
.timer { font: 500 14px var(--sans); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; padding: 7px 12px 7px 10px;
  background: var(--rose-soft); color: var(--rose-deep); font: 700 13px var(--sans);
}
.pill svg { width: 16px; height: 16px; }
.pill.bump { animation: bump .5s; }
@keyframes bump { 40% { transform: scale(1.18); } }

.finbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 16px; padding: 12px 14px;
  background: var(--card); border-radius: 14px; box-shadow: 0 0 0 1px var(--rule);
}
.finbar strong { font: 600 17px var(--serif); }
.finbar button { border: 0; background: var(--rose); color: #fff; border-radius: 999px; padding: 8px 14px; font: 600 13px var(--sans); white-space: nowrap; }

.board { display: grid; gap: 22px; }
@media (min-width: 880px) {
  .board { grid-template-columns: auto minmax(300px, 380px); align-items: start; justify-content: center; gap: 40px; }
}
.gridwrap { display: flex; justify-content: center; }
.grid { display: grid; grid-template-columns: repeat(var(--w), var(--cell)); grid-auto-rows: var(--cell); gap: 1px; padding: 1px; }
.cell {
  position: relative; background: var(--card); box-shadow: 0 0 0 1px var(--ink);
  display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; -webkit-user-select: none;
  font: 600 calc(var(--cell) * .56)/1 var(--sans); text-transform: uppercase; transition: background-color .12s;
}
.cell .n { position: absolute; top: 2px; left: 3px; font: 500 calc(var(--cell) * .26)/1 var(--sans); }
.cell .ch { transform: translateY(6%); }
.cell.solved { background: var(--gold); color: var(--gold-ink); }
.cell.word { background: var(--rose-soft); }
.cell.solved.word { background: #f3d39a; }
.cell.sel { background: var(--rose-mid); }
.cell.bad { animation: shake .42s; color: var(--rose-deep); }
.cell.pop { animation: pop .55s cubic-bezier(.3, 1.6, .5, 1) both; animation-delay: calc(var(--i) * 45ms); }
@keyframes pop { 40% { transform: scale(1.22); z-index: 2; } }

.dock { display: flex; flex-direction: column; gap: 8px; }
.cluebar { display: flex; align-items: stretch; background: var(--rose-soft); border-radius: 12px; min-height: 52px; }
.cluebar .nav { border: 0; background: none; width: 40px; flex-shrink: 0; display: grid; place-items: center; color: var(--rose-deep); }
.cluebar .nav svg { width: 18px; height: 18px; }
.cluetext { flex: 1; border: 0; background: none; text-align: left; padding: 9px 2px; display: flex; gap: 10px; align-items: center; font: 400 15px/1.3 var(--sans); }
.cluenum { font-weight: 700; color: var(--rose-deep); white-space: nowrap; }

.lists { display: grid; gap: 18px; }
.lists h2 { font: 600 11px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 6px; padding: 0 10px; }
.lists ol { list-style: none; margin: 0; padding: 0; }
.lists li { display: flex; gap: 10px; padding: 8px 10px; border-radius: 10px; cursor: pointer; font-size: 15px; line-height: 1.35; border-left: 3px solid transparent; }
.lists li .n { font-weight: 700; min-width: 1.3em; }
.lists li.cur { background: var(--rose-soft); border-left-color: var(--rose); }
.lists li.done { color: var(--ink-2); }
.lists li.done .t::after { content: " ✓"; color: var(--rose); font-weight: 700; }

/* touch: clue bar + keyboard docked at the bottom */
.touch .dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
  background: rgba(251, 246, 238, .96); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 -1px 0 var(--rule); transition: transform .25s ease;
}
.touch .dock.away { transform: translateY(105%); }
.touch .cluebar { height: 78px; }
.touch .cluetext { overflow: hidden; }
.kb { display: none; }
.touch .kb { display: flex; flex-direction: column; gap: 7px; }
.kb .row { display: flex; gap: 5px; justify-content: center; }
.kb button {
  flex: 1; max-width: 42px; height: 46px; border: 0; border-radius: 7px; background: var(--key); padding: 0;
  font: 600 18px var(--sans); box-shadow: 0 1px 0 #d2c6b6;
}
.kb button:active, .kb button.down { background: var(--rose-mid); }
.kb button.wide { max-width: 64px; flex: 1.5; display: grid; place-items: center; }
.kb button.wide svg { width: 24px; height: 24px; }

/* ---------- gift cards ---------- */
.wallet { margin-top: 34px; }
.wallet-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.wallet h2 { font: 600 22px var(--serif); margin: 0; }
.wallet-head span { font-size: 13px; color: var(--ink-2); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.gc {
  position: relative; overflow: hidden; aspect-ratio: 1.586; border-radius: 14px; padding: 12px 13px; border: 0; text-align: left;
  color: #fff; background: linear-gradient(135deg, var(--c1), var(--c2)); display: flex; flex-direction: column; justify-content: space-between;
  box-shadow: 0 10px 22px -14px rgba(40, 20, 10, .6);
}
.gc::before, .gc::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255, 255, 255, .1); pointer-events: none; }
.gc::before { width: 70%; aspect-ratio: 1; right: -22%; top: -38%; }
.gc::after { width: 46%; aspect-ratio: 1; right: 8%; bottom: -36%; background: rgba(255, 255, 255, .07); }
.gc .brand { font: 600 19px/1.1 var(--serif); position: relative; }
.gc .amt { position: relative; font: 700 22px/1 var(--sans); letter-spacing: .01em; }
.gc .foot { display: flex; justify-content: space-between; align-items: flex-end; position: relative; }
.gc .tag { font: 600 9.5px/1.2 var(--sans); letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
.gc.big { padding: 20px 20px 18px; border-radius: 18px; }
.gc.big .brand { font-size: 30px; }
.gc.big .amt { font-size: 38px; }
.gc.big .tag { font-size: 11px; }
.gc.locked {
  background: repeating-linear-gradient(-45deg, var(--paper-2) 0 8px, var(--paper) 8px 16px); color: var(--ink-2);
  box-shadow: inset 0 0 0 1.5px var(--rule);
}
.gc.locked::before, .gc.locked::after { display: none; }
.gc.locked svg { width: 20px; height: 20px; fill: var(--ink-2); }
.gc.locked .which { font: 600 15px var(--serif); color: var(--ink); }
.gc.fresh { animation: pop .6s cubic-bezier(.3, 1.6, .5, 1); }

/* ---------- sheet ---------- */
.sheet { position: fixed; inset: 0; z-index: 50; background: rgba(31, 26, 23, .42); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
@media (min-width: 600px) { .sheet { align-items: center; } .sheet-card { border-radius: 22px !important; } }
@keyframes fade { from { opacity: 0; } }
.sheet-card {
  width: min(430px, 100%); max-height: 92vh; overflow-y: auto; background: var(--paper); border-radius: 22px 22px 0 0;
  padding: 26px 20px calc(18px + env(safe-area-inset-bottom)); text-align: center; animation: up .42s cubic-bezier(.2, .9, .3, 1.15);
}
@keyframes up { from { transform: translateY(40%); opacity: 0; } }
.sheet-card .eyebrow { margin-bottom: 16px; }
.flip { perspective: 1100px; }
.flip .inner { position: relative; transition: transform .8s cubic-bezier(.3, .8, .3, 1.1); transform-style: preserve-3d; aspect-ratio: 1.586; }
.flip.open .inner { transform: rotateY(180deg); }
.flip .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.flip .front { transform: rotateY(180deg); }
.wrap {
  border: 0; border-radius: 18px; padding: 0; overflow: hidden; background: linear-gradient(135deg, #d4567a, #a8334f);
  box-shadow: 0 14px 28px -14px rgba(120, 30, 50, .7);
}
.wrap .rib-v, .wrap .rib-h { position: absolute; background: linear-gradient(90deg, #f6dc8e, #e9c45f, #f6dc8e); }
.wrap .rib-v { left: 50%; top: 0; bottom: 0; width: 26px; transform: translateX(-50%); }
.wrap .rib-h { top: 50%; left: 0; right: 0; height: 26px; transform: translateY(-50%); background: linear-gradient(180deg, #f6dc8e, #e9c45f, #f6dc8e); }
.wrap .bow { position: absolute; left: 50%; top: 50%; width: 92px; transform: translate(-50%, -62%); }
.below { position: relative; }
.tapnote { position: absolute; top: 20px; left: 0; right: 0; margin: 0; font: 400 italic 17px var(--serif); color: var(--ink-2); animation: breathe 1.8s ease-in-out infinite; transition: opacity .2s; }
.flip.open + .below .tapnote { opacity: 0; animation: none; }
@keyframes breathe { 50% { opacity: .45; } }
.details { opacity: 0; transform: translateY(8px); transition: opacity .4s .5s, transform .4s .5s; pointer-events: none; }
.details.show { opacity: 1; transform: none; pointer-events: auto; }
.memo { font: 400 italic 17px/1.4 var(--serif); color: var(--ink-2); margin: 18px 6px 4px; }
.note { font-size: 15px; margin: 8px 6px 0; }
.coderow { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 12px; padding: 10px 10px 10px 14px; margin-top: 12px; box-shadow: 0 0 0 1px var(--rule); text-align: left; }
.coderow .lbl { font: 600 10px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); width: 34px; flex-shrink: 0; }
.coderow code { flex: 1; font: 600 16px/1.3 ui-monospace, 'SF Mono', Menlo, monospace; letter-spacing: .04em; word-break: break-all; user-select: all; -webkit-user-select: all; }
.coderow button { border: 0; background: var(--rose-soft); color: var(--rose-deep); border-radius: 8px; padding: 8px 12px; font: 700 13px var(--sans); white-space: nowrap; }
.fin h2 { font: 600 34px/1.1 var(--serif); margin: 0; }
.fin .time { color: var(--ink-2); margin: 6px 0 18px; }
.fin .letter { text-align: left; font: 400 18px/1.55 var(--serif); background: var(--card); border-radius: 14px; padding: 18px 18px 6px; box-shadow: 0 0 0 1px var(--rule); }
.fin .letter p { margin: 0 0 12px; }
.fin .sig { font: 400 italic 20px var(--serif); text-align: right; margin: 4px 4px 0; }

/* ---------- confetti ---------- */
.hearts { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.hearts i { position: absolute; top: -24px; border-radius: 2px; opacity: 0; animation: fall var(--d) cubic-bezier(.25, .5, .45, 1) var(--delay) forwards; }
@keyframes fall {
  0% { transform: translate(0, 0) rotate(0); opacity: 1; }
  85% { opacity: 1; }
  100% { transform: translate(var(--x), 108vh) rotate(var(--r)); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .hearts { display: none; } .cell.pop, .gc.fresh { animation: none; } }
</style>
</head>
<body>

<main id="lock" class="lock">
  <form id="pwform" class="envelope" autocomplete="off">
    <p class="eyebrow">A tiny little crossword for</p>
    <h1 class="to">Leilanie R.</h1>
    <label for="pw">Hint: Your favorite song for a while, our song of the summer</label>
    <input id="pw" name="pw" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="password">
    <button class="btn rose" id="pwbtn" type="submit">Open</button>
    <p class="msg" id="pwmsg" role="status"></p>
    <p class="hint2" id="hint2" hidden>Dont ____ __ __</p>
  </form>
</main>

<div id="app" class="app" hidden>
  <header class="top">
    <div><h1 id="title"></h1><p id="intro"></p></div>
    <div class="meta">
      <span class="timer" id="timer">0:00</span>
      <button class="pill" id="pill" type="button" aria-label="Your gifts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>
        <span id="count">0/0</span>
      </button>
    </div>
  </header>
  <div id="finbar" class="finbar" hidden>
    <strong id="finbarText"></strong>
    <button type="button" id="finbarBtn">Read your note</button>
  </div>
  <div class="board">
    <div class="gridwrap"><div id="grid" class="grid" role="grid" aria-label="Crossword"></div></div>
    <div class="side">
      <div id="dock" class="dock">
        <div class="cluebar">
          <button class="nav" id="prev" type="button" aria-label="Previous clue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
          <button class="cluetext" id="cluetext" type="button"><span class="cluenum" id="cluenum"></span><span id="cluestr"></span></button>
          <button class="nav" id="next" type="button" aria-label="Next clue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
        </div>
        <div class="kb" id="kb"></div>
      </div>
      <div class="lists" id="lists" style="margin-top:18px">
        <div><h2>Across</h2><ol id="across"></ol></div>
        <div><h2>Down</h2><ol id="down"></ol></div>
      </div>
    </div>
  </div>
  <section class="wallet" id="wallet">
    <div class="wallet-head"><h2>Your gifts</h2><span id="walletcount"></span></div>
    <div class="cards" id="cards"></div>
  </section>
</div>

<div id="sheet" class="sheet" hidden><div class="sheet-card" id="sheetcard" role="dialog" aria-modal="true"></div></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const enc = new TextEncoder(), dec = new TextDecoder();
  const b64 = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
  const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
  const VAULT = JSON.parse($('#vault').textContent);
  const NS = 'xwgift:' + VAULT.salt.slice(0, 12) + ':';
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(NS + k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(NS + k, JSON.stringify(v)); } catch {} },
  };
  // ?reset wipes saved progress before anything can re-save it
  if (new URLSearchParams(location.search).has('reset')) {
    try { Object.keys(localStorage).filter(k => k.startsWith(NS)).forEach(k => localStorage.removeItem(k)); } catch {}
    history.replaceState(null, '', location.pathname);
  }
  const isTouch = matchMedia('(hover: none) and (pointer: coarse)').matches;
  if (isTouch) document.documentElement.classList.add('touch');

  const LOCK = '<svg viewBox="0 0 24 24"><path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2zm-7-2a2 2 0 0 1 4 0v2h-4V7zm2 11a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>';
  const BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M21 5H8.5L3 12l5.5 7H21a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M11 9l6 6M17 9l-6 6" stroke-linecap="round"/></svg>';

  // ---------- crypto ----------
  const normPw = s => s.normalize('NFKD').toLowerCase().replace(/[^a-z0-9]/g, '');
  async function openBox(key, box) {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(box.iv) }, key, b64(box.ct));
    return JSON.parse(dec.decode(pt));
  }
  async function pwKey(pw) {
    const base = await crypto.subtle.importKey('raw', enc.encode(normPw(pw)), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(VAULT.salt), iterations: VAULT.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }
  async function hashKey(s) {
    const h = await crypto.subtle.digest('SHA-256', enc.encode(s));
    return crypto.subtle.importKey('raw', h, 'AES-GCM', false, ['decrypt']);
  }
  async function unlock(pw) {
    const key = await pwKey(pw);
    for (const slot of VAULT.slots) {
      try {
        const k = await crypto.subtle.importKey('raw', b64(await openBox(key, slot)), 'AES-GCM', false, ['decrypt']);
        return await openBox(k, VAULT.box);
      } catch {}
    }
    throw new Error('wrong password');
  }

  // ---------- lock screen ----------
  const form = $('#pwform'), msg = $('#pwmsg'), pwbtn = $('#pwbtn');
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const pw = $('#pw').value;
    if (!pw.trim()) return;
    if (!window.crypto?.subtle) { msg.textContent = 'This browser can’t open it. Try Safari or Chrome.'; return; }
    pwbtn.disabled = true; msg.textContent = 'Opening…';
    try {
      const payload = await unlock(pw);
      store.set('pw', pw);
      start(payload);
    } catch {
      const h2 = $('#hint2');
      msg.textContent = h2.textContent.trim() ? 'Not quite. Here’s another hint:' : 'Not quite, try again.';
      if (h2.textContent.trim()) h2.hidden = false;
      form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
    } finally { pwbtn.disabled = false; }
  });
  const remembered = store.get('pw');
  if (remembered && window.crypto?.subtle) {
    $('#lock').style.visibility = 'hidden';
    unlock(remembered).then(start).catch(() => { $('#lock').style.visibility = ''; });
  }

  // ---------- puzzle state ----------
  let P, words = [], sel, dir = 'A', letters = {}, elapsed = 0, done = false, finalePending = false, ticking = null;
  const cells = new Map(), solved = new Set(), gifts = {};
  const other = d => (d === 'A' ? 'D' : 'A');
  const dirName = d => (d === 'A' ? 'Across' : 'Down');
  const locked = k => { const c = cells.get(k); return (c.A != null && solved.has(c.A)) || (c.D != null && solved.has(c.D)); };
  const cur = () => { const c = cells.get(sel); return words[c[dir] ?? c[other(dir)]]; };
  const guessOf = w => w.cells.map(k => letters[k] || '').join('');
  const fmt = s => (s >= 3600 ? Math.floor(s / 3600) + ':' + String(Math.floor(s / 60) % 60).padStart(2, '0') : Math.floor(s / 60)) + ':' + String(s % 60).padStart(2, '0');
  const save = () => store.set('state', { g: letters, t: elapsed });

  function start(payload) {
    P = payload;
    $('#lock').hidden = true;
    $('#app').hidden = false;
    $('#title').textContent = P.title;
    $('#intro').textContent = P.intro;
    words = P.words.map((w, i) => ({
      ...w, i,
      cells: Array.from({ length: w.len }, (_, k) => (w.dir === 'A' ? `${w.r},${w.c + k}` : `${w.r + k},${w.c}`)),
    }));
    for (const w of words) w.cells.forEach((k, idx) => {
      const c = cells.get(k) || { k, A: null, D: null, n: 0 };
      c[w.dir] = w.i;
      if (idx === 0) c.n = w.n;
      cells.set(k, c);
    });

    const grid = $('#grid');
    grid.style.setProperty('--w', P.w);
    for (let r = 0; r < P.h; r++) for (let c = 0; c < P.w; c++) {
      const k = `${r},${c}`, cell = cells.get(k), el = document.createElement('div');
      if (cell) {
        el.className = 'cell';
        el.dataset.k = k;
        el.setAttribute('role', 'gridcell');
        el.innerHTML = (cell.n ? `<span class="n">${cell.n}</span>` : '') + '<span class="ch"></span>';
        cell.el = el;
        cell.ch = el.querySelector('.ch');
      }
      grid.appendChild(el);
    }
    for (const d of ['A', 'D']) {
      $(d === 'A' ? '#across' : '#down').innerHTML = words.filter(w => w.dir === d)
        .map(w => `<li data-w="${w.i}"><span class="n">${w.n}</span><span class="t">${esc(w.clue)}</span></li>`).join('');
    }
    $('#kb').innerHTML = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'].map((row, i) =>
      `<div class="row">${[...row].map(L => `<button type="button" data-key="${L}">${L}</button>`).join('')}${i === 2 ? `<button type="button" class="wide" data-key="BK" aria-label="Delete">${BACK}</button>` : ''}</div>`).join('');

    const st = store.get('state') || {};
    letters = st.g || {};
    elapsed = st.t || 0;
    $('#timer').textContent = fmt(elapsed);
    sel = words[0].cells[0];
    dir = words[0].dir;
    wire();
    renderWallet();
    paint();
    sizeGrid();

    Promise.all(words.map(w => checkWord(w, true))).then(() => {
      if (solved.size === words.length) return;
      const next = words.find(w => !solved.has(w.i));
      selectWord(next);
      startTimer();
    });
  }

  function sizeGrid() {
    const dock = $('#dock');
    if (isTouch) document.documentElement.style.setProperty('--dockh', dock.offsetHeight + 'px');
    const wide = innerWidth >= 880;
    const availW = Math.min(wide ? 600 : 620, innerWidth - 32 - (wide ? 420 : 0));
    const top = $('.top').offsetHeight + ($('#finbar').hidden ? 0 : $('#finbar').offsetHeight + 16);
    const availH = innerHeight - top - (isTouch ? dock.offsetHeight : 0) - 44;
    const s = Math.floor(Math.max(24, Math.min(56, (availW - P.w) / P.w, (availH - P.h) / P.h)));
    document.documentElement.style.setProperty('--cell', s + 'px');
  }

  function paint() {
    const w = cur(), inWord = new Set(w.cells);
    for (const [k, c] of cells) {
      c.ch.textContent = letters[k] || '';
      c.el.classList.toggle('word', inWord.has(k));
      c.el.classList.toggle('sel', k === sel && !done);
      c.el.classList.toggle('solved', locked(k));
    }
    $('#cluenum').textContent = w.n + w.dir;
    $('#cluestr').textContent = w.clue;
    document.querySelectorAll('.lists li').forEach(li => {
      const i = +li.dataset.w;
      li.classList.toggle('cur', i === w.i);
      li.classList.toggle('done', solved.has(i));
    });
    $('#count').textContent = `${solved.size}/${words.length}`;
    $('#walletcount').textContent = `${solved.size} of ${words.length} unwrapped`;
  }

  function selectWord(w, scroll) {
    dir = w.dir;
    sel = w.cells.find(k => !letters[k] && !locked(k)) || w.cells.find(k => !locked(k)) || w.cells[0];
    paint();
    if (scroll) $('#grid').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function jumpWord(delta, skipSolved) {
    const at = cur().i;
    for (let s = 1; s <= words.length; s++) {
      const w = words[(at + delta * s + words.length * 2) % words.length];
      if (!skipSolved || !solved.has(w.i)) return selectWord(w);
    }
  }

  // ---------- typing ----------
  function input(L) {
    if (done) return;
    const w = cur();
    if (solved.has(w.i)) return jumpWord(1, true);
    let i = w.cells.indexOf(sel);
    while (i < w.len && locked(w.cells[i])) i++;
    if (i >= w.len) i = w.cells.findIndex(k => !locked(k));
    const k = w.cells[i];
    letters[k] = L;
    let j = -1;
    for (let x = i + 1; x < w.len && j < 0; x++) if (!locked(w.cells[x]) && !letters[w.cells[x]]) j = x;
    for (let x = i + 1; x < w.len && j < 0; x++) if (!locked(w.cells[x])) j = x;
    sel = w.cells[j < 0 ? i : j];
    paint();
    save();
    const c = cells.get(k);
    for (const wi of [c.A, c.D]) if (wi != null) checkWord(words[wi], false);
  }
  function backspace() {
    if (done) return;
    const w = cur();
    if (solved.has(w.i)) return;
    if (letters[sel] && !locked(sel)) delete letters[sel];
    else {
      let j = w.cells.indexOf(sel) - 1;
      while (j >= 0 && locked(w.cells[j])) j--;
      if (j < 0) return;
      sel = w.cells[j];
      delete letters[sel];
    }
    paint();
    save();
  }
  function arrow(key) {
    const [dr, dc] = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[key];
    const want = dr ? 'D' : 'A';
    if (dir !== want && cells.get(sel)[want] != null) { dir = want; return paint(); }
    let [r, c] = sel.split(',').map(Number);
    while (true) {
      r += dr; c += dc;
      if (r < 0 || c < 0 || r >= P.h || c >= P.w) return;
      const k = `${r},${c}`;
      if (cells.has(k)) {
        sel = k;
        if (cells.get(k)[dir] == null) dir = other(dir);
        return paint();
      }
    }
  }

  // ---------- checking: the right answer is the only key that opens its gift ----------
  async function checkWord(w, silent) {
    if (solved.has(w.i)) return;
    const guess = guessOf(w);
    if (guess.length !== w.len) return;
    let gift;
    try { gift = await openBox(await hashKey(`gift|${VAULT.salt}|${guess}`), w.box); }
    catch {
      if (!silent && guessOf(w) === guess) wiggle(w);
      return;
    }
    if (solved.has(w.i) || guessOf(w) !== guess) return;
    solved.add(w.i);
    gifts[w.i] = { ...gift, answer: guess };
    renderWallet(silent ? null : w.i);
    if (solved.size === words.length) {
      await finish(silent);
    } else if (!silent) {
      jumpWord(1, true);
    }
    paint();
    if (!silent) {
      w.cells.forEach((k, idx) => {
        const el = cells.get(k).el;
        el.style.setProperty('--i', idx);
        el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
      });
      const pill = $('#pill');
      pill.classList.remove('bump'); void pill.offsetWidth; pill.classList.add('bump');
      setTimeout(() => showGift(w, true), 650);
    }
  }
  function wiggle(w) {
    w.cells.forEach(k => {
      const el = cells.get(k).el;
      el.classList.remove('bad'); void el.offsetWidth; el.classList.add('bad');
      setTimeout(() => el.classList.remove('bad'), 900);
    });
  }

  async function finish(silent) {
    done = true;
    clearInterval(ticking);
    save();
    try { P.fin = await openBox(await hashKey(`finale|${VAULT.salt}|${words.map(w => gifts[w.i].answer).join('|')}`), P.finale); }
    catch { P.fin = null; }
    store.set('done', elapsed);
    $('#finbarText').textContent = `Solved in ${fmt(elapsed)}`;
    $('#finbar').hidden = false;
    $('#dock').classList.add('away');
    if (!silent) finalePending = true;
  }

  // ---------- gifts ----------
  function cardFace(g, big) {
    return `<span class="brand">${esc(g.brand)}</span><span class="amt">${esc(g.amount)}</span>`;
  }
  function renderWallet(freshIdx) {
    $('#cards').innerHTML = words.map(w => {
      const g = gifts[w.i];
      if (!g) return `<button type="button" class="gc locked" data-w="${w.i}">${LOCK}<span><span class="which">${w.n} ${dirName(w.dir)}</span><br><span class="tag">solve to unwrap</span></span></button>`;
      return `<button type="button" class="gc${w.i === freshIdx ? ' fresh' : ''}" data-w="${w.i}" style="--c1:${esc(g.color || '#a8334f')};--c2:${esc(g.color2 || g.color || '#c8456b')}">${cardFace(g)}</button>`;
    }).join('');
  }

  function openSheet(html) {
    $('#sheetcard').innerHTML = html;
    $('#sheet').hidden = false;
  }
  function closeSheet() {
    $('#sheet').hidden = true;
    if (finalePending) { finalePending = false; setTimeout(showFinale, 250); }
  }

  function showGift(w, fresh) {
    const g = gifts[w.i];
    const rows = [['Code', g.code], ['PIN', g.pin]].filter(([, v]) => v)
      .map(([l, v]) => `<div class="coderow"><span class="lbl">${l}</span><code>${esc(v)}</code><button type="button" data-copy="${esc(v)}">Copy</button></div>`).join('');
    openSheet(`
      <p class="eyebrow">${fresh ? 'You got it : )' : `${w.n} ${dirName(w.dir)}`}</p>
      <div class="flip${fresh ? '' : ' open'}" id="flip">
        <div class="inner">
          <button type="button" class="face wrap" id="unwrap" aria-label="Unwrap your gift">
            <span class="rib-v"></span><span class="rib-h"></span>
            <svg class="bow" viewBox="0 0 100 60"><path fill="#f2d27a" stroke="#d9ad3c" stroke-width="2" d="M50 34C38 14 12 4 8 18s20 22 42 16zM50 34c12-20 38-30 42-16s-20 22-42 16z"/><path fill="#e9c45f" stroke="#d9ad3c" stroke-width="2" d="M50 34l-14 24 8-2 6 4zM50 34l14 24-8-2-6 4z"/><circle cx="50" cy="34" r="8" fill="#f6dc8e" stroke="#d9ad3c" stroke-width="2"/></svg>
          </button>
          <div class="face front gc big" style="--c1:${esc(g.color || '#a8334f')};--c2:${esc(g.color2 || g.color || '#c8456b')}">${cardFace(g, true)}</div>
        </div>
      </div>
      <div class="below">${fresh ? '<p class="tapnote">Tap the present to unwrap it</p>' : ''}
      <div class="details${fresh ? '' : ' show'}" id="details">
        ${g.note ? `<p class="note">${esc(g.note)}</p>` : ''}
        ${rows}
        ${g.url ? `<a class="btn" href="${esc(g.url)}" target="_blank" rel="noopener">Open gift card</a>` : ''}
        <button type="button" class="btn ghost" data-close>${done && finalePending ? 'One more thing…' : fresh ? 'Keep solving' : 'Close'}</button>
      </div></div>`);
    if (fresh) $('#unwrap').addEventListener('click', () => {
      $('#flip').classList.add('open');
      $('#details').classList.add('show');
      confetti(60);
    }, { once: true });
  }

  function showFinale() {
    const f = P.fin;
    const paras = (f?.text || '').split(/\n\s*\n/).map(p => `<p>${esc(p).replace(/\n/g, '<br>')}</p>`).join('');
    openSheet(`<div class="fin">
      <p class="eyebrow">all ${words.length} gifts unwrapped</p>
      <h2>You solved it!</h2>
      <p class="time">in ${fmt(elapsed)}</p>
      ${paras ? `<div class="letter">${paras}<p class="sig">${esc(f.signoff || 'Love,')}<br>${esc(f.from)}</p></div>` : ''}
      <button type="button" class="btn ghost" data-close>Close</button></div>`);
    confetti(140);
  }

  function confetti(n) {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const box = $('#hearts'), colors = ['#c8456b', '#f2a8bc', '#e9c45f', '#4f8fd6', '#5fb37a', '#f08a3c', '#9b6fd6'];
    for (let i = 0; i < n; i++) {
      const c = document.createElement('i');
      c.style.left = Math.random() * 100 + 'vw';
      c.style.width = 6 + Math.random() * 5 + 'px';
      c.style.height = 9 + Math.random() * 7 + 'px';
      c.style.background = colors[i % colors.length];
      c.style.setProperty('--d', 2.2 + Math.random() * 1.8 + 's');
      c.style.setProperty('--delay', Math.random() * 0.6 + 's');
      c.style.setProperty('--x', (Math.random() - 0.5) * 220 + 'px');
      c.style.setProperty('--r', (Math.random() - 0.5) * 1440 + 'deg');
      box.appendChild(c);
      setTimeout(() => c.remove(), 5000);
    }
  }

  function startTimer() {
    clearInterval(ticking);
    ticking = setInterval(() => {
      if (done || document.visibilityState !== 'visible' || !$('#sheet').hidden) return;
      elapsed++;
      $('#timer').textContent = fmt(elapsed);
      if (elapsed % 5 === 0) save();
    }, 1000);
  }

  // ---------- events ----------
  function wire() {
    $('#grid').addEventListener('click', e => {
      const el = e.target.closest('.cell');
      if (!el || done) return;
      const k = el.dataset.k, c = cells.get(k);
      if (k === sel && c.A != null && c.D != null) dir = other(dir);
      else { sel = k; if (c[dir] == null) dir = other(dir); }
      $('#dock').classList.remove('away');
      paint();
    });
    $('#kb').addEventListener('pointerdown', e => {
      const b = e.target.closest('button');
      if (!b) return;
      e.preventDefault();
      b.classList.add('down');
      setTimeout(() => b.classList.remove('down'), 110);
      b.dataset.key === 'BK' ? backspace() : input(b.dataset.key);
    });
    $('#prev').addEventListener('click', () => jumpWord(-1, false));
    $('#next').addEventListener('click', () => jumpWord(1, false));
    $('#cluetext').addEventListener('click', () => {
      if (cells.get(sel)[other(dir)] != null) { dir = other(dir); paint(); }
    });
    $('#lists').addEventListener('click', e => {
      const li = e.target.closest('li');
      if (li && !done) selectWord(words[+li.dataset.w], isTouch);
    });
    $('#cards').addEventListener('click', e => {
      const b = e.target.closest('.gc');
      if (!b) return;
      const w = words[+b.dataset.w];
      if (gifts[w.i]) showGift(w, false);
      else { selectWord(w, true); $('#dock').classList.remove('away'); }
    });
    $('#pill').addEventListener('click', () => $('#wallet').scrollIntoView({ behavior: 'smooth', block: 'start' }));
    $('#finbarBtn').addEventListener('click', showFinale);
    $('#sheet').addEventListener('click', e => {
      if (e.target === $('#sheet') || e.target.closest('[data-close]')) return closeSheet();
      const cp = e.target.closest('[data-copy]');
      if (cp) {
        const ok = () => { cp.textContent = 'Copied!'; setTimeout(() => (cp.textContent = 'Copy'), 1600); };
        navigator.clipboard?.writeText(cp.dataset.copy).then(ok, () => {
          const r = document.createRange(); r.selectNodeContents(cp.previousElementSibling);
          getSelection().removeAllRanges(); getSelection().addRange(r);
        });
      }
    });
    document.addEventListener('keydown', e => {
      if (!$('#sheet').hidden) { if (e.key === 'Escape') closeSheet(); return; }
      if (e.metaKey || e.ctrlKey || e.altKey || done) return;
      if (/^[a-z]$/i.test(e.key)) input(e.key.toUpperCase());
      else if (e.key === 'Backspace' || e.key === 'Delete') backspace();
      else if (e.key === 'Tab' || e.key === 'Enter') jumpWord(e.shiftKey ? -1 : 1, false);
      else if (e.key.startsWith('Arrow')) arrow(e.key);
      else if (e.key === ' ') { if (cells.get(sel)[other(dir)] != null) { dir = other(dir); paint(); } }
      else return;
      e.preventDefault();
    });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); });
    addEventListener('resize', sizeGrid);
    if (isTouch && 'IntersectionObserver' in window) {
      new IntersectionObserver(([en]) => {
        if (!done) $('#dock').classList.toggle('away', en.intersectionRatio < 0.35);
      }, { threshold: [0, 0.35, 1] }).observe($('#grid'));
    }
  }
})();
</script>
</body>
</html>
